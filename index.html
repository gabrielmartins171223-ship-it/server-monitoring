<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f4f6f1" />
<meta name="description" content="Painel responsivo de monitoramento do servidor." />
<title>srv-producao-01 · painel do servidor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="page">

  <header class="topbar">
    <div class="topbar-id">
      <span class="server-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3" y="4" width="18" height="6" rx="1.5"></rect>
          <rect x="3" y="14" width="18" height="6" rx="1.5"></rect>
          <circle cx="7" cy="7" r="0.8" fill="currentColor"></circle>
          <circle cx="7" cy="17" r="0.8" fill="currentColor"></circle>
        </svg>
      </span>
      <div>
        <h1>srv-producao-01</h1>
        <p class="subtitle">no ar há <span id="uptime-value">—</span></p>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="status-pill" id="global-status">
        <span class="dot dot-online"></span>
        operacional
      </span>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Alternar tema claro e escuro">
        <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M12 2.5v2.4M12 19v2.4M4.4 4.4l1.7 1.7M17.9 17.9l1.7 1.7M2.5 12h2.4M19 12h2.4M4.4 19.6l1.7-1.7M17.9 6.1l1.7-1.7"></path>
        </svg>
      </button>
    </div>
  </header>

  <section class="kpi-grid" id="kpi-grid" aria-label="Métricas principais do servidor"></section>

  <section class="mid-grid">
    <div class="panel chart-panel">
      <div class="panel-head">
        <h2>Conexões nas últimas 24h</h2>
        <span class="panel-hint" id="chart-hint">—</span>
      </div>
      <canvas id="online-chart" height="220" role="img" aria-label="Gráfico de linha mostrando o número de usuários conectados ao longo das últimas 24 horas"></canvas>
    </div>

    <div class="panel resources-panel">
      <div class="panel-head">
        <h2>Recursos</h2>
      </div>
      <div class="resource-list" id="resource-list"></div>
    </div>
  </section>

  <section class="bottom-grid">
    <div class="panel users-panel">
      <div class="panel-head">
        <h2>Usuários conectados</h2>
        <div class="table-controls">
          <input type="text" id="search-input" placeholder="Buscar usuário" aria-label="Buscar usuário" />
          <select id="status-filter" aria-label="Filtrar por status">
            <option value="all">Todos os status</option>
            <option value="online">Online</option>
            <option value="idle">Ausente</option>
            <option value="offline">Offline</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-dot"></th>
              <th>Usuário</th>
              <th>Status</th>
              <th>Ping</th>
              <th>Conectado há</th>
            </tr>
          </thead>
          <tbody id="user-rows"></tbody>
        </table>
      </div>
    </div>

    <div class="panel activity-panel">
      <div class="panel-head">
        <h2>Atividade recente</h2>
      </div>
      <div class="activity-list" id="activity-list"></div>
    </div>
  </section>

  <footer class="page-footer">
    <p>Dados simulados para fins de demonstração · atualiza automaticamente</p>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
